# Broker MQTT do RaptorLink (Eclipse Mosquitto 2)
# Ambiente didático/local: acesso anônimo liberado. Não exponha à internet assim.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# MQTT "puro" — motor de simulação em Node.js e ferramentas como MQTT Explorer
listener 1883
protocol mqtt
allow_anonymous true

# MQTT sobre WebSocket — painel web no navegador
listener 9001
protocol websockets
allow_anonymous true
